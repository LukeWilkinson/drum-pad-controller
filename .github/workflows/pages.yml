# Builds the app and publishes it to GitHub Pages.
# The site lives at https://<user>.github.io/<repo>/, so the build uses the repo name as its base path.
# Manual only for now: the repo is private, and Pages needs a public repo on GitHub's free plan
# (Netlify builds the site instead, see netlify.toml). To use Pages, add `push: branches: [main]`.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          HTTP: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
